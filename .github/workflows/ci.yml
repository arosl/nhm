name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: cross-build the release platforms
        run: |
          for cmd in nhm nhm-hook; do
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null "./cmd/$cmd"
            GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null "./cmd/$cmd"
          done

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: shellcheck
        # nhm-palette is a Bash script without the .sh suffix.
        run: shellcheck install.sh scripts/*.sh scripts/nhm-palette tests/*.sh
      - name: the palette
        run: bash tests/palette_test.sh
      - name: install.sh against a local release
        run: |
          sudo apt-get install -y zstd
          bash tests/install_test.sh

  herdr-fit:
    # A private, headless herdr server of the pinned release (its SHA256 is
    # checked): nhm doctor --herdr-fit --placements, the X0 fit test that
    # nhm's interactive surfaces rely on, then the surfaces themselves
    # through an attached client in a pty (nhm-qbi.11).
    runs-on: ubuntu-24.04
    # A hung herdr, client or download must not hold the runner for
    # GitHub's 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: nhm doctor --herdr-fit
        run: bash tests/herdr_fit_test.sh
      - name: the Go surfaces in herdr
        run: bash tests/surfaces_e2e.sh
